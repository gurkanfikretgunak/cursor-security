name: Cursor Security Scan
description: Build @cursor-security/mcp, scan the repo, emit SARIF, and annotate the job
inputs:
  project-path:
    description: Path to scan
    required: false
    default: .
  fail-on:
    description: Fail if findings at or above this severity
    required: false
    default: high
  format:
    description: markdown | json | sarif
    required: false
    default: sarif
  output:
    description: Output file path
    required: false
    default: security-results.sarif
  include-osv:
    description: Include npm audit signals
    required: false
    default: "false"
outputs:
  output-file:
    description: Path to the written report
    value: ${{ inputs.output }}
runs:
  using: composite
  steps:
    - name: Build MCP
      shell: bash
      run: npm run build -w @cursor-security/mcp
    - name: Scan
      shell: bash
      run: |
        set -euo pipefail
        EXTRA=""
        if [ "${{ inputs.include-osv }}" = "true" ]; then EXTRA="--osv"; fi
        set +e
        node packages/cursor-security-mcp/dist/cli.js \
          --format "${{ inputs.format }}" \
          --out "${{ inputs.output }}" \
          --fail-on "${{ inputs.fail-on }}" \
          $EXTRA \
          "${{ inputs.project-path }}"
        code=$?
        set -e
        if [ -f "${{ inputs.output }}" ] && [ "${{ inputs.format }}" = "sarif" ]; then
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const sarif = JSON.parse(readFileSync(process.argv[1], "utf8"));
            for (const run of sarif.runs ?? []) {
              for (const result of run.results ?? []) {
                const loc = result.locations?.[0]?.physicalLocation;
                const file = loc?.artifactLocation?.uri || "README.md";
                const line = loc?.region?.startLine || 1;
                const level = result.level === "error" ? "error" : result.level === "warning" ? "warning" : "notice";
                const msg = String(result.message?.text ?? "").replace(/[\r\n]+/g, " ");
                console.log(`::${level} file=${file},line=${line}::${msg}`);
              }
            }
          ' "${{ inputs.output }}"
        fi
        exit "$code"
