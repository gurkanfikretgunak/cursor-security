name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build security package
        run: npm run build -w masterfabric-next-sec

      - name: Build MCP package
        run: npm run build -w @cursor-security/mcp

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: apps/api/go.sum

      - name: Test Go API
        working-directory: apps/api
        run: go test ./...

      - name: Build Go API
        working-directory: apps/api
        run: go build -o /tmp/cursor-security-api ./cmd/server

      - name: MCP unit tests
        run: npm run test -w @cursor-security/mcp

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build web
        env:
          AUTH_SECRET: ci-build-secret-not-for-production
          AUTH_URL: http://localhost:3000
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/cursor_security
        run: npm run build -w @cursor-security/web

      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true

  deploy-render:
    name: Deploy backend (Render)
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "Skipping Render deploy: RENDER_DEPLOY_HOOK is not set"
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
