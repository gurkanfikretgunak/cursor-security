name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build security package
        run: npm run build -w masterfabric-next-sec

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build web
        env:
          AUTH_SECRET: ci-build-secret-not-for-production
          AUTH_URL: http://localhost:3000
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/cursor_security
        run: npm run build -w @cursor-security/web

      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true
