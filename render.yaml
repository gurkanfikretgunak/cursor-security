# Blueprint for the Cursor Security API + Postgres backend on Render.
# Production deploys are triggered from GitHub Actions (autoDeployTrigger: off).
databases:
  - name: cursor-security-db
    plan: free
    region: oregon
    postgresMajorVersion: 16

services:
  - type: web
    name: cursor-security-api
    runtime: go
    plan: free
    region: oregon
    branch: main
    rootDir: apps/api
    autoDeployTrigger: off
    healthCheckPath: /health
    buildCommand: go build -o bin/server ./cmd/server
    startCommand: ./bin/server
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cursor-security-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://gurkan-cursor-security.vercel.app
