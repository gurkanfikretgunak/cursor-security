# Blueprint for the Cursor Security API + Postgres backend on Render.
# Production deploys are triggered from GitHub Actions (autoDeployTrigger: off).
databases:
  - name: cursor-security-db
    plan: free
    region: oregon
    postgresMajorVersion: 16

services:
  - type: web
    name: cursor-security-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: off
    healthCheckPath: /health
    buildCommand: npm ci && npm run build -w @cursor-security/api
    startCommand: npm run db:migrate -w @cursor-security/web && npm run start -w @cursor-security/api
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cursor-security-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://gurkan-cursor-security.vercel.app
